[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lascheck"
version = "0.1.0"
description = "Quality-assurance CLI for LAS/LAZ LiDAR point clouds: CRS, classification, density, header consistency, return integrity."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "passkeywebauthn" }]
keywords = [
    "lidar",
    "las",
    "laz",
    "point-cloud",
    "pdal",
    "geospatial",
    "qc",
    "validation",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "laspy[lazrs]>=2.5",
    "numpy>=1.21",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
lascheck = "lascheck.cli:main"

[project.urls]
Homepage = "https://github.com/passkeywebauthn/lascheck"
Issues = "https://github.com/passkeywebauthn/lascheck/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lascheck"]
